<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>港股 IPO · 项目排程</title>
  <link rel="stylesheet" href="scheduler.css?v=0.19.0">
</head>
<body id="appShell">
<header class="topbar">
  <div class="brand"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#182e4c"/><path d="M7 24h8m-3-6h12m-3-6h8" fill="none" stroke="#87decd" stroke-width="3" stroke-linecap="round"/></svg><span>港股 IPO</span><i></i><h1>项目排程</h1></div>
  <nav aria-label="工作区"><button id="presentation" aria-pressed="false">演示视图</button><details class="menu" id="fileMenu"><summary>方案文件</summary><div><button id="openImport">导入方案</button><button id="exportPlan">导出方案</button></div></details><input type="file" id="importPlan" accept=".json,application/json" hidden></nav>
</header>
<div class="workspace">
  <aside class="settings" aria-label="项目设置">
    <div class="settings-body">
      <div class="heading"><h2>项目设置</h2><button id="newPlan" class="text-button">＋ 新建</button></div>
      <label>当前方案<select id="planSelect"></select></label>
      <details class="fold"><summary>方案管理</summary><label>方案名称<input id="planName" placeholder="输入方案名称"></label><div class="button-row"><button id="copyPlan">复制方案</button><button id="deletePlan" class="danger">删除方案</button></div></details>
      <section><h3>关键日期</h3>
        <label>财务数据安排<select id="financialMode"><option value="legacy" disabled>沿用原方案</option><option value="complete">完整报告期</option><option value="staged">分两阶段提供</option></select></label>
        <p id="financialInfo" class="hint"></p>
        <div id="anchorInputs"></div>
        <label id="financialCoverageLabel" hidden>首批财务数据基准日<input type="date" id="financialBaseDate"></label><div id="firstAvailableInput"></div>
      </section>
      <details class="fold"><summary>更多设置</summary>
        <label class="check" id="cybersecurityLabel" hidden><input type="checkbox" id="cybersecurity">开展网络安全及数据合规尽调</label>
        <label>A1 申报节点<select id="a1Select"></select></label>
        <label>重新排程时<select id="replanMode"><option value="optimize">优化时间表</option><option value="repair_only">仅修复硬冲突</option></select></label>
        <button id="refreshFinancial" hidden>用新规则创建副本</button>
      </details>
    </div>
    <div class="settings-footer"><button id="run" class="primary wide">生成排程</button><div class="secondary-actions"><button id="earliestA1" class="text-button">试算最早 A1</button><button id="cancel" disabled class="text-button">停止计算</button></div><p id="saveState" role="status" class="hint">方案保存在本机</p></div>
  </aside>
  <main>
    <section class="overview" aria-label="项目概览">
      <div class="overview-main"><div class="eyebrow"><span></span> IPO TIMELINE</div><h2 id="viewTitle">项目时间表</h2><p id="viewSubtitle"></p></div>
      <div id="summaryStats" class="stats"></div>
    </section>
    <div id="milestones" class="milestones" aria-label="项目关键日期"></div>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <details id="resultNotes" class="notes" hidden><summary id="noteCount">排程提示</summary><ul id="noteList"></ul></details>
    <div id="pendingBar" class="pending" hidden><div><strong id="pendingTitle">待确认排程</strong><p id="pendingText"></p></div><div class="button-row"><button id="discardResult">放弃预览</button><button id="acceptResult" class="primary">采用此版本</button></div></div>
    <div id="conflicts" hidden></div>
    <section class="schedule" aria-label="时间表">
      <div class="section-head"><h3>项目时间表</h3><div id="legend" class="legend" hidden><span>事件</span><span>锚点</span><span>手动调整</span></div></div>
      <div class="toolbar" id="boardTools" hidden><select id="viewMode" aria-label="时间表视图"><option value="weeks">按周查看</option><option value="list">事件清单</option><option value="changes">本次变动</option></select><input id="search" type="search" aria-label="搜索事件、编码或负责方" placeholder="搜索事件、编码或负责方"><details class="menu" id="boardMenu"><summary>时间表操作</summary><div><button id="jumpStart">定位启动周</button><button id="jumpA1">定位申报周</button><button id="collapseAll">收起全部条线</button><button id="expandAll">展开全部条线</button><button id="exportCSV">导出日期表</button></div></details></div>
      <div id="board" class="board"></div><p class="board-foot" id="weekMoveHint" hidden>拖动卡片可调整单个事件的周次；点击卡片查看详情。</p>
    </section>
    <details id="historySection" class="history" hidden><summary>历史版本</summary><div id="historyList"></div></details>
  </main>
  <aside id="inspector" class="inspector" aria-label="事件详情"><div class="heading"><h2>事件详情</h2><button id="closeInspector" aria-label="关闭详情">×</button></div><div id="eventDetails"></div></aside>
</div>
<div id="toast" role="status" hidden></div>
<script src="scheduler-engine.js?v=0.18.0"></script>
<script src="scheduler-draft.js?v=0.1.0"></script>
<script src="scheduler-rule-revision.js?v=0.2.0"></script>
<script src="scheduler-prospectus-revision.js?v=0.3.0"></script>
<script src="scheduler-feedback-revision.js?v=0.6.0"></script>
<script src="scheduler-feedback-batch2.js?v=0.7.0"></script>
<script src="scheduler-prospectus-grouping.js?v=0.8.0"></script>
<script src="scheduler-meeting-cycle.js?v=0.9.0"></script>
<script src="scheduler-flexible-planning.js?v=0.10.0"></script>
<script src="scheduler-public-holidays.js?v=0.15.0"></script>
<script src="cloud-config.js?v=0.11.0"></script>
<script src="scheduler-cloud-library.js?v=0.11.0"></script>
<script src="scheduler-execution-revision.js?v=0.17.0"></script>
<script src="scheduler-event-responsibilities.js?v=1"></script>
<script src="scheduler-financial-planning.js?v=2026-11-27-roles"></script>
<script src="scheduler-app.js?v=0.19.1"></script>
</body>
</html>
